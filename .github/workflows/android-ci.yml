name: Meemo Android CI

on:
  push:
    branches:
      - main
      - develop
      - meemo-project-upload
  pull_request:
    branches:
      - main
      - develop
      - meemo-project-upload
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9 and cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Repair Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          test -s gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'
          chmod +x gradlew
          ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meemo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meemo-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
