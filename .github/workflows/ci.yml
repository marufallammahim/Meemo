name: Meemo CI

on:
  push:
    branches:
      - main
      - "master/**"
  pull_request:
    branches:
      - main
      - "master/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meemo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Build, lint, static analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Android lint
        run: ./gradlew --no-daemon lint

      - name: Detekt
        run: ./gradlew --no-daemon detekt

      - name: KtLint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
